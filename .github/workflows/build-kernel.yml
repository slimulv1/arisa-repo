name: Build Kernel

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write  # notify-on-failure job opens an issue on build failure

concurrency:
  group: kernel-build
  cancel-in-progress: false

env:
  RELEASE_TAG: repository
  REPO_DB_NAME: arisa
  CCACHE_DIR: /tmp/ccache

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      kernel: ${{ steps.set-kernel.outputs.kernel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Identify kernel package
        id: set-kernel
        run: |
          set -euo pipefail
          # packages.txt is the single source of truth (same parsing as sync-aur.yml).
          mapfile -t VALID_PKGS < <(sed 's/#.*//' packages.txt | sed 's/^local:[[:space:]]*//' | awk '{print $1}' | grep -v '^$')

          kernel=""
          for p in "${VALID_PKGS[@]}"; do
            if [[ ! -f "$p/PKGBUILD" ]]; then
              echo "::warning::PKGBUILD missing for $p — skipping"
              continue
            fi
            if [[ "$p" == "linux-arisa" ]]; then
              kernel="$p"
              break
            fi
          done

          echo "kernel=$kernel" >> "$GITHUB_OUTPUT"

  build-kernel:
    needs: prepare
    if: needs.prepare.outputs.kernel != ''
    runs-on: ubuntu-latest
    timeout-minutes: 240
    container:
      image: ghcr.io/slimulv1/arisa-build:latest
    env:
      CCACHE_DIR: /tmp/ccache
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Free disk space before build
        run: bash "$GITHUB_WORKSPACE/.github/scripts/free-disk.sh"

      - name: Restore ccache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /tmp/ccache
          key: ccache-kernel-${{ github.sha }}
          restore-keys: |
            ccache-kernel-

      - name: Restore pacman package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/pacman/pkg
          key: pacman-cache-${{ github.sha }}
          restore-keys: |
            pacman-cache-

      - name: Configure ccache
        run: |
          set -euo pipefail
          mkdir -p "${CCACHE_DIR}"
          chown -R builder:builder "${CCACHE_DIR}"
          sudo -u builder env CCACHE_DIR="${CCACHE_DIR}" PATH="/usr/lib/ccache/bin:$PATH" ccache -M 5G
          ccache --version | head -1

      - name: Prepare build environment
        uses: ./.github/actions/prepare-env

      - name: Build, Cache and Fallback Logic
        uses: ./.github/actions/build-one-package
        with:
          package: ${{ needs.prepare.outputs.kernel }}

      - name: Prune pacman cache (cap 10GB)
        run: |
          set -euo pipefail
          paccache -rk 5 -c /var/cache/pacman/pkg --nocolor || true
          du -sh /var/cache/pacman/pkg

      - name: Save ccache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: /tmp/ccache
          key: ccache-kernel-${{ github.sha }}

      - name: Save pacman package cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        if: always()
        with:
          path: /var/cache/pacman/pkg
          key: pacman-cache-${{ github.sha }}

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pkg-linux-arisa
          path: output/*
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish Packages to Release
    needs: build-kernel
    uses: ./.github/workflows/publish.yml
    with:
      build_run_id: ${{ github.run_id }}
      # Kernel runs upload only pkg-linux-arisa; the generic 'pkg-' prefix
      # would download it a second time via the package pattern. A prefix
      # that matches nothing skips the duplicate (no-match is non-fatal).
      packages_artifact_prefix: 'pkg-none-'
    secrets: inherit

  notify-on-failure:
    name: Notify on build failure
    needs: [prepare, build-kernel]
    if: always() && (failure() || cancelled())
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 Kernel build failed (run ${{ github.run_id }})"
          BODY="The kernel build workflow failed or was cancelled for run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Triggered by: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`.

          *Automated notification — details in the run log above.*"
          gh issue create --repo "${{ github.repository }}" \
            --title "$TITLE" --body "$BODY" || true