name: Build Packages

on:
  schedule:
    - cron: '0 19 * * *'
  push:
    branches: [main]
    paths-ignore:
      - '.github/**'
      - 'README.md'
      - 'packages.txt'
      - 'docker/**'
      - 'linux-arisa/**'
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write
  issues: write  # notify-on-failure job opens an issue on build failure

concurrency:
  group: package-build
  cancel-in-progress: true

env:
  RELEASE_TAG: repository
  REPO_DB_NAME: arisa

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Generate matrix from packages.txt
        id: set-matrix
        run: |
          set -euo pipefail
          # packages.txt is the single source of truth (same parsing as sync-aur.yml).
          mapfile -t VALID_PKGS < <(sed 's/#.*//' packages.txt | sed 's/^local:[[:space:]]*//' | awk '{print $1}' | grep -v '^$')

          pkgs=()
          for p in "${VALID_PKGS[@]}"; do
            if [[ ! -f "$p/PKGBUILD" ]]; then
              echo "::warning::PKGBUILD missing for $p — skipping"
              continue
            fi
            # Kernel is built separately in build-kernel.yml
            if [[ "$p" == "linux-arisa" ]]; then
              continue
            fi
            pkgs+=("$p")
          done

          MATRIX_JSON=$(printf '%s\n' "${pkgs[@]}" | jq -R . | jq -s -c .)
          echo "Found packages: $MATRIX_JSON"
          echo "matrix=$MATRIX_JSON" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 200
    container:
      image: ghcr.io/slimulv1/arisa-build@sha256:729baf440d588235c6297f54d3aa8bb3822d0d0513bdebd77c804c240cda8599
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Free disk space before build
        run: bash "$GITHUB_WORKSPACE/.github/scripts/free-disk.sh"

      - name: Restore pacman package cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: /var/cache/pacman/pkg
          key: pacman-cache-${{ github.sha }}
          restore-keys: |
            pacman-cache-

      - name: Prepare build environment
        uses: ./.github/actions/prepare-env

      - name: Build, Cache and Fallback Logic
        uses: ./.github/actions/build-one-package
        with:
          package: ${{ matrix.package }}

      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pkg-${{ matrix.package }}
          path: output/*
          if-no-files-found: ignore
          retention-days: 1

  publish:
    name: Publish Packages to Release
    needs: build
    uses: ./.github/workflows/publish.yml
    with:
      build_run_id: ${{ github.run_id }}
    secrets: inherit

  notify-on-failure:
    name: Notify on build failure
    needs: [prepare, build]
    if: always() && (failure() || cancelled())
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 Package build failed (run ${{ github.run_id }})"
          BODY="The package build workflow failed or was cancelled for run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Triggered by: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`.

          *Automated notification — details in the run log above.*"
          gh issue create --repo "${{ github.repository }}" \
            --title "$TITLE" --body "$BODY" || true