name: Sync AUR Packages
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'packages.txt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: aur-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Validate packages.txt exists
        run: |
          if [[ ! -f packages.txt ]]; then
            echo "::error::packages.txt not found at repo root"
            exit 1
          fi

      - name: Sync packages and prune removed
        id: sync
        run: |
          set -uo pipefail
          SYNCED=()
          FAILED=()
          REMOVED=()

          # --- CachyOS-PKGBUILDS: sparse + blob-filtered clone (metadata only) ---
          echo "Cloning CachyOS-PKGBUILDS repository (sparse, blob:none)..."
          rm -rf /tmp/cachyos-pkgbuilds
          CACHYOS_OK=false
          if git clone --depth=1 --filter=blob:none --sparse \
               "https://github.com/CachyOS/CachyOS-PKGBUILDS.git" \
               /tmp/cachyos-pkgbuilds >/tmp/cachyos-clone.log 2>&1; then
            CACHYOS_OK=true
            git -C /tmp/cachyos-pkgbuilds ls-tree -r --name-only HEAD \
              > /tmp/cachyos-tree.txt
          else
            echo "::warning::Failed to clone CachyOS repository"
            cat /tmp/cachyos-clone.log
            : > /tmp/cachyos-tree.txt
          fi

          mapfile -t VALID_PKGS < <(sed 's/#.*//' packages.txt | sed 's/^local:[[:space:]]*//' | awk '{print $1}' | grep -v '^$')

          # --- Prune directories no longer listed in packages.txt ---
          for dir in */ ; do
            [[ -e "$dir" ]] || continue
            dir="${dir%/}"
            case "$dir" in
              .github|docker) continue ;;
            esac
            if ! printf '%s\n' "${VALID_PKGS[@]}" | grep -q -x "$dir"; then
              echo "Removing obsolete package directory: $dir"
              rm -rf "$dir"
              REMOVED+=("$dir")
            fi
          done

          # --- Pass 1: find which packages exist in CachyOS (tree metadata only) ---
          declare -A CACHYOS_PATHS
          CACHYOS_HITS=()
          while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
            pkg_entry="$(echo "$raw_line" | sed 's/#.*//' | xargs)"
            [[ -z "$pkg_entry" ]] && continue
            [[ "$pkg_entry" == local:* ]] && continue
            pkg="$pkg_entry"
            pkgbuild_path=$(grep -E "(^|/)$pkg/PKGBUILD$" /tmp/cachyos-tree.txt | head -1 || true)
            if [[ -n "$pkgbuild_path" ]]; then
              CACHYOS_PATHS["$pkg"]="/tmp/cachyos-pkgbuilds/${pkgbuild_path%/PKGBUILD}"
              CACHYOS_HITS+=("$pkg")
            fi
          done < packages.txt

          # --- Materialize only the needed CachyOS directories ---
          if [[ "$CACHYOS_OK" == "true" && ${#CACHYOS_HITS[@]} -gt 0 ]]; then
            echo "Sparse-checking out ${#CACHYOS_HITS[@]} package(s) from CachyOS..."
            git -C /tmp/cachyos-pkgbuilds sparse-checkout set "${CACHYOS_HITS[@]}" >/dev/null 2>&1 || true
            git -C /tmp/cachyos-pkgbuilds checkout HEAD -- "${CACHYOS_HITS[@]}" 2>/dev/null || true
          fi

          # --- Pass 2: sync each package (CachyOS first, then AUR snapshot) ---
          while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
            pkg_entry="$(echo "$raw_line" | sed 's/#.*//' | xargs)"
            [[ -z "$pkg_entry" ]] && continue

            if [[ "$pkg_entry" == local:* ]]; then
              pkg="${pkg_entry#local:}"
              echo "Skipping sync for local package: $pkg"
              continue
            fi

            pkg="$pkg_entry"
            src_dir="${CACHYOS_PATHS[$pkg]:-}"

            if [[ -n "$src_dir" && -f "$src_dir/PKGBUILD" ]]; then
              echo "Found $pkg in CachyOS-PKGBUILDS (sparse-checkout)"
              mkdir -p "$pkg"
              find "$pkg" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              rsync -a --exclude='.git' "$src_dir/" "$pkg/"
              SYNCED+=("$pkg")
              continue
            fi

            echo "Not found in CachyOS. Downloading $pkg snapshot from AUR..."
            snap="/tmp/aur-snap-$pkg.tar.gz"
            SNAP_OK=false
            for attempt in 1 2 3; do
              if curl -fsSL --connect-timeout 15 "https://aur.archlinux.org/cgit/aur.git/snapshot/${pkg}.tar.gz" -o "$snap"; then
                SNAP_OK=true
                break
              fi
              echo "::warning::Snapshot download failed for $pkg (attempt $attempt/3). Retrying in $((attempt * 5))s..."
              sleep $((attempt * 5))
            done
            if [[ "$SNAP_OK" != "true" ]]; then
              echo "::warning::Snapshot download failed for $pkg"
              FAILED+=("$pkg")
              continue
            fi
            mkdir -p "/tmp/aur-snap-extract/$pkg" "$pkg"
            if ! tar -xzf "$snap" -C "/tmp/aur-snap-extract/$pkg" --strip-components=1 2>/dev/null; then
              echo "::warning::Snapshot extract failed for $pkg"
              FAILED+=("$pkg")
              rm -f "$snap"
              continue
            fi
            rm -f "$snap"
            find "$pkg" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
            rsync -a "/tmp/aur-snap-extract/$pkg/" "$pkg/"
            SYNCED+=("$pkg")
          done < packages.txt

          echo "synced=${SYNCED[*]}" >> "$GITHUB_OUTPUT"
          echo "failed=${FAILED[*]}" >> "$GITHUB_OUTPUT"
          echo "removed=${REMOVED[*]}" >> "$GITHUB_OUTPUT"

          echo "### Sync summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Synced: ${SYNCED[*]:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Failed: ${FAILED[*]:-none}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Removed: ${REMOVED[*]:-none}" >> "$GITHUB_STEP_SUMMARY"

      - name: Create or update aggregated pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore(aur-sync): sync package sources and prune deletions'
          branch: aur-sync
          delete-branch: true
          title: 'AUR sync: cập nhật và dọn dẹp source packages'
          labels: aur-sync
          body: |
            ### 🔄 AUR / CachyOS Synchronization Report

            Hệ thống tự động đã thực hiện kiểm tra và đồng bộ hóa các gói từ CachyOS và AUR.

            | Trạng thái | Gói phần mềm |
            | :--- | :--- |
            | 🟢 **Synced Successfully** | `${{ steps.sync.outputs.synced || 'none' }}` |
            | 🔴 **Failed to Sync** | `${{ steps.sync.outputs.failed || 'none' }}` |
            | 🧹 **Pruned / Removed** | `${{ steps.sync.outputs.removed || 'none' }}` |

            ---
            *Vui lòng kiểm tra trạng thái verify build bên dưới trước khi thực hiện merge.*
