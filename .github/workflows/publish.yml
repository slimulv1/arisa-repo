name: Publish Repository

on:
  workflow_call:
    inputs:
      build_run_id:
        description: 'Run ID of the caller workflow that produced the artifacts'
        type: string
        required: true
      kernel_artifact_name:
        description: 'Name of the kernel artifact'
        type: string
        default: 'pkg-linux-arisa'
      packages_artifact_prefix:
        description: 'Prefix for package artifacts'
        type: string
        default: 'pkg-'

permissions:
  contents: write
  actions: write
  issues: write  # notify-on-failure job opens an issue on publish failure

# The concurrency group is repository-scoped (shared across all caller
# workflows): concurrent publishes SERIALIZE (FIFO) instead of cancelling
# each other. cancel-in-progress: false so a publish in flight is never
# killed mid-way (no broken DB window).
concurrency:
  group: publish-repo
  cancel-in-progress: false

env:
  RELEASE_TAG: repository
  REPO_DB_NAME: arisa

jobs:
  publish:
    name: Publish Packages to Release
    runs-on: ubuntu-latest
    container: ghcr.io/slimulv1/arisa-build@sha256:10b2187bf20ed7fa66b4150fcd31a3bf0f818f9168b68288d1d902a3b17ad882
    timeout-minutes: 30
    environment: arisa-production
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - name: Download kernel artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: output
          pattern: ${{ inputs.kernel_artifact_name }}
          merge-multiple: true
          run-id: ${{ inputs.build_run_id }}

      - name: Download package artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: output
          pattern: ${{ inputs.packages_artifact_prefix }}*
          merge-multiple: true
          run-id: ${{ inputs.build_run_id }}

      - name: Union with current release packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"
          cd output

          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release does not exist yet — nothing to union."
            exit 0
          fi

          # Source name of a makepkg artifact: pkgname-pkgver-pkgrel-arch.pkg.tar.zst
          strip_source() { echo "${1%-*-*-*.pkg.tar.zst}"; }

          # Batch = packages just built by the caller (root of output/)
          declare -A batch_bases=()
          shopt -s nullglob
          for f in *.pkg.tar.zst; do
            batch_bases["$(strip_source "$f")"]=1
          done

          # Carry over every package on the release that the batch does not
          # already supersede (same source name). Keeps the repo complete
          # when a caller only rebuilt a subset of packages.
          mkdir -p union
          gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[] | select(.name | endswith(".pkg.tar.zst")) | .name' \
            | sort > /tmp/release-pkgs.txt

          while IFS= read -r name; do
            [[ -n "$name" ]] || continue
            if [[ -n "${batch_bases[$(strip_source "$name")]:-}" ]]; then
              echo "Skip (superseded by batch): $name"
              continue
            fi
            echo "Union from release: $name"
            gh release download "$TAG" --repo "$REPO" --pattern "$name" --dir union --clobber
          done < /tmp/release-pkgs.txt

      - name: Prepare database and manifest (no renaming, idempotent)
        id: prepare
        env:
          GH_TOKEN: ${{ github.token }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          cd output
          shopt -s nullglob

          # Import the GPG signing key if a secret is configured (optional
          # signing: the repository works unsigned too, see README).
          if [[ -n "${GPG_PRIVATE_KEY:-}" ]]; then
            if echo "$GPG_PRIVATE_KEY" | gpg --batch --import 2>/tmp/gpg-import.err; then
              echo "GPG signing key imported successfully"
            else
              echo "::warning::Failed to import GPG key - DB will be unsigned: $(tr '\n' ' ' < /tmp/gpg-import.err)"
            fi
          else
            echo "No GPG_PRIVATE_KEY secret set - publishing unsigned database"
          fi

          # Batch = packages built by the caller workflow (already in cwd).
          BATCH_PKGS=()
          for f in *.pkg.tar.zst; do
            BATCH_PKGS+=("$f")
          done

          # Union files were downloaded into union/ — move them up so the
          # whole current package set lives in one directory.
          for f in union/*.pkg.tar.zst; do
            mv "$f" .
          done
          rmdir union 2>/dev/null || true

          ALL_PKGS=()
          for f in *.pkg.tar.zst; do
            ALL_PKGS+=("$f")
          done

          if (( ${#ALL_PKGS[@]} == 0 )); then
            echo "No packages available (neither built nor on release). Halting."
            echo "has_packages=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "has_packages=true" >> "$GITHUB_OUTPUT"
          echo "Batch packages: ${#BATCH_PKGS[@]}"
          echo "Carried-over packages: $(( ${#ALL_PKGS[@]} - ${#BATCH_PKGS[@]} ))"
          echo "Total packages: ${#ALL_PKGS[@]}"

          # Keep makepkg names (pkgname-version-arch.pkg.tar.zst): immutable
          # per version, idempotent re-publish (--clobber), and matches
          # build-one-package EXPECTED_PKGS.
          echo "Generating pacman database from union set..."
          SIGN_ARGS=()
          if gpg --batch --list-secret-keys >/dev/null 2>&1; then
            SIGN_ARGS=(--sign)
            echo "GPG signing key present - signing package database"
          else
            echo "No GPG signing key available - publishing unsigned database"
          fi
          repo-add "${SIGN_ARGS[@]}" "${REPO_DB_NAME}.db.tar.gz" "${ALL_PKGS[@]}"

          # Hash manifest keyed by SOURCE package name (strip
          # -pkgver-pkgrel-arch): build-one-package looks up REPO_HASH via
          # awk '$1==pkg' with pkg = the source directory name.
          echo "Generating package hash manifest..."
          : > pkg-hashes.txt
          for pkg in "${ALL_PKGS[@]}"; do
            pkg_hash=$(sha256sum "$pkg" | cut -d' ' -f1)
            pkg_base="${pkg%-*-*-*.pkg.tar.zst}"
            echo "$pkg_base $pkg_hash" >> pkg-hashes.txt
          done
          sort pkg-hashes.txt -o pkg-hashes.txt
          echo "Generated $(wc -l < pkg-hashes.txt) hash entries"

          DB_FILES=("${REPO_DB_NAME}.db" "${REPO_DB_NAME}.db.tar.gz" "${REPO_DB_NAME}.files" "${REPO_DB_NAME}.files.tar.gz")
          HASH_MANIFEST="pkg-hashes.txt"

          echo "batch_packages=$(printf '%s\n' "${BATCH_PKGS[@]}" | jq -R . | jq -s -c .)" >> "$GITHUB_OUTPUT"
          echo "db_files=$(printf '%s\n' "${DB_FILES[@]}" | jq -R . | jq -s -c .)" >> "$GITHUB_OUTPUT"
          echo "hash_manifest=$HASH_MANIFEST" >> "$GITHUB_OUTPUT"

      - name: Create or verify release exists
        id: release
        if: steps.prepare.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"

          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release $TAG exists."
            echo "release_exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Creating release $TAG."
            gh release create "$TAG" --repo "$REPO" \
              --title "Arch Package Repository" \
              --notes "Auto-built pacman repository."
            echo "release_exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload batch packages (new builds only)
        if: steps.prepare.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass JSON via env (NOT inline ${{ }}): embedded double quotes in the
          # JSON would break shell quoting and make jq fail silently, uploading 0.
          BATCH_JSON: ${{ steps.prepare.outputs.batch_packages }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"
          cd output

          # Shared retry helper (defined in .github/scripts/retry.sh)
          source "$GITHUB_WORKSPACE/.github/scripts/retry.sh"

          mapfile -t BATCH_PKGS < <(printf '%s' "$BATCH_JSON" | jq -r '.[]')

          echo "Uploading ${#BATCH_PKGS[@]} batch packages..."
          for pkg in "${BATCH_PKGS[@]}"; do
            if [[ -f "$pkg" ]]; then
              echo "  Uploading $pkg"
              retry 3 gh release upload "$TAG" "$pkg" --repo "$REPO" --clobber
            fi
          done

      - name: Upload database files (atomic switch)
        if: steps.prepare.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DB_JSON: ${{ steps.prepare.outputs.db_files }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"
          cd output

          # Shared retry helper (defined in .github/scripts/retry.sh)
          source "$GITHUB_WORKSPACE/.github/scripts/retry.sh"

          mapfile -t DB_FILES < <(printf '%s' "$DB_JSON" | jq -r '.[]')
          HASH_MANIFEST="${{ steps.prepare.outputs.hash_manifest }}"

          echo "Verifying generated database..."
          tar -tf "${REPO_DB_NAME}.db.tar.gz" >/dev/null 2>&1 \
            || { echo "ERROR: ${REPO_DB_NAME}.db.tar.gz is not a valid gzip tar archive"; exit 1; }

          echo "Uploading database and file snapshots (atomic switch)..."
          for f in "${DB_FILES[@]}"; do
            if [[ -f "$f" ]]; then
              echo "  Uploading $f"
              retry 3 gh release upload "$TAG" "$f" --repo "$REPO" --clobber
            fi
          done

          # Upload hash manifest as part of atomic switch
          if [[ -f "$HASH_MANIFEST" ]]; then
            echo "Uploading package hash manifest (atomic switch)..."
            retry 3 gh release upload "$TAG" "$HASH_MANIFEST" --repo "$REPO" --clobber
          fi

          # Upload DB signatures (created by repo-add --sign) if present
          for sig in "${REPO_DB_NAME}.db.tar.gz.sig" "${REPO_DB_NAME}.files.tar.gz.sig"; do
            if [[ -f "$sig" ]]; then
              echo "Uploading signature $sig (atomic switch)..."
              retry 3 gh release upload "$TAG" "$sig" --repo "$REPO" --clobber
            fi
          done

          # Publish the signing public key so users can verify the DB
          if gpg --batch --list-secret-keys >/dev/null 2>&1; then
            gpg --armor --export > arisa.gpg
            if [[ -s arisa.gpg ]]; then
              echo "Uploading signing public key arisa.gpg..."
              retry 3 gh release upload "$TAG" arisa.gpg --repo "$REPO" --clobber
            fi
          fi

      - name: Generate manifest from release assets (source of truth)
        if: steps.prepare.outputs.has_packages == 'true'
        id: manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"
          cd output

          echo "Generating manifest FROM release assets (source of truth)..."

          # Query release assets to get actual uploaded package list
          gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[] | select(.name | endswith(".pkg.tar.zst")) | .name' \
            | sort > /tmp/release-pkgs.txt

          if [[ ! -s /tmp/release-pkgs.txt ]]; then
            echo "No packages found on release!"
            exit 1
          fi

          # Generate manifest from actual release assets, mapping each asset
          # back to its source package name and the hash we computed locally.
          > pkg-hashes-from-release.txt
          while IFS= read -r pkg_name; do
            [[ -n "$pkg_name" ]] || continue
            pkg_src="${pkg_name%-*-*-*.pkg.tar.zst}"
            local_hash=$(awk -v p="$pkg_src" '$1==p {print $2}' pkg-hashes.txt 2>/dev/null || true)
            if [[ -n "$local_hash" ]]; then
              echo "$pkg_src $local_hash" >> pkg-hashes-from-release.txt
            else
              echo "::warning::No local hash found for $pkg_src"
            fi
          done < /tmp/release-pkgs.txt

          sort pkg-hashes-from-release.txt -o pkg-hashes-from-release.txt
          echo "Generated manifest from release: $(wc -l < pkg-hashes-from-release.txt) entries"

          # Shared retry helper (defined in .github/scripts/retry.sh)
          source "$GITHUB_WORKSPACE/.github/scripts/retry.sh"

          echo "Uploading verified manifest from release assets..."
          retry 3 gh release upload "$TAG" pkg-hashes-from-release.txt --repo "$REPO" --clobber

      - name: Delete stale assets LAST (not in current package set)
        if: steps.prepare.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"
          cd output

          echo "Cleaning stale assets from release (assets not in current package set)..."

          # All assets currently on the release
          gh release view "$TAG" --repo "$REPO" --json assets \
            -q '.assets[].name' > /tmp/all-assets.txt

          # Current package set = the local union set (batch + carried over),
          # i.e. exactly what the DB uploaded above references.
          shopt -s nullglob
          for f in *.pkg.tar.zst; do
            echo "$f"
          done > /tmp/current-pkgs.txt

          DB_FILES=("${REPO_DB_NAME}.db" "${REPO_DB_NAME}.db.tar.gz" "${REPO_DB_NAME}.files" "${REPO_DB_NAME}.files.tar.gz" "${REPO_DB_NAME}.db.tar.gz.sig" "${REPO_DB_NAME}.files.tar.gz.sig")
          HASH_MANIFESTS=("pkg-hashes.txt" "pkg-hashes-from-release.txt" "arisa.gpg")

          # Build keep list
          > /tmp/keep-assets.txt
          cat /tmp/current-pkgs.txt >> /tmp/keep-assets.txt
          for dbf in "${DB_FILES[@]}"; do echo "$dbf" >> /tmp/keep-assets.txt; done
          for hm in "${HASH_MANIFESTS[@]}"; do echo "$hm" >> /tmp/keep-assets.txt; done
          sort -u /tmp/keep-assets.txt -o /tmp/keep-assets.txt

          # Delete assets not in keep list
          while IFS= read -r asset; do
            [[ -n "$asset" ]] || continue
            if ! grep -q -F -x "$asset" /tmp/keep-assets.txt; then
              echo "Deleting stale asset: $asset"
              if ! gh release delete-asset "$TAG" "$asset" --repo "$REPO" -y 2>/tmp/delete-asset.err; then
                echo "::warning::Failed to delete stale asset $asset: $(tr '\n' ' ' < /tmp/delete-asset.err)"
              fi
            fi
          done < /tmp/all-assets.txt

          echo "Stale asset cleanup complete."

      - name: Prune CI caches (keep newest per prefix)
        if: steps.prepare.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keep 2 kernel ccache entries (~3.6GB each) + 3 pacman caches (~214MB
          # each) so the total stays well under the 10GB repo cache limit and
          # GitHub never evicts a cache we still need (avoids full kernel rebuilds).
          prune_prefix() {
            local prefix="$1" keep="$2"
            echo "Pruning '$prefix' caches (keeping $keep newest)..."
            mapfile -t ids < <(gh cache list --key "$prefix" --sort created_at --order desc --json id,key -q '.[].id')
            for i in "${!ids[@]}"; do
              if (( i >= keep )); then
                echo "  Deleting cache ${ids[$i]}"
                gh cache delete "${ids[$i]}" -y || true
              fi
            done
          }
          prune_prefix pacman-cache- 3
          prune_prefix ccache-kernel- 2

      - name: Update release notes
        if: steps.prepare.outputs.has_packages == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          TAG="${{ env.RELEASE_TAG }}"

          RELEASE_NOTES=$(cat <<EOF
          ### 📦 Repository Update Summary

          **Last Updated:** $(date -u '+%Y-%m-%d %H:%M UTC')
          **Commit:** ${{ github.sha }}
          **Run ID:** ${{ github.run_id }}

          #### 📦 Published Packages
          $(cd output && ls -1 *.pkg.tar.zst 2>/dev/null | sed 's/^/- /' || echo "- None")

          ---
          *Automated publish by GitHub Actions.*
          EOF
          )

          source "$GITHUB_WORKSPACE/.github/scripts/retry.sh"
          retry 3 gh release edit "$TAG" --repo "$REPO" --notes "$RELEASE_NOTES"

  notify-on-failure:
    name: Notify on publish failure
    needs: publish
    if: always() && (failure() || cancelled())
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TITLE="🚨 Release publish failed (run ${{ github.run_id }})"
          BODY="The publish workflow failed or was cancelled for run [${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          Triggered by: \`${{ github.event_name }}\` on \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`.

          *Automated notification — details in the run log above.*"
          gh issue create --repo "${{ github.repository }}" \
            --title "$TITLE" --body "$BODY" || true