name: Update Build Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'docker/build-image/Dockerfile'

permissions:
  contents: read
  packages: write

jobs:
  build-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./docker/build-image
          file: ./docker/build-image/Dockerfile
          push: true
          tags: ghcr.io/slimulv1/arisa-build:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max