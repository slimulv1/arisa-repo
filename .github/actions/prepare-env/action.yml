name: Prepare build environment
description: Shared environment setup for every build job (custom [arisa] repo
  + fresh package database, workspace ownership). Keeps the matrix and kernel
  jobs DRY. The makepkg v3 config is baked into the build image
  (docker/build-image), so no runtime download happens anymore. Assumes the
  repository is already checked out by the job.

runs:
  using: composite
  steps:
    - name: Sync package database and add custom repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        # Retry helpers for transient network/CDN failures (e.g. the Fastly
        # SSL blip seen on 2026-08-11, or the GitHub API 500 that killed a
        # publish on 2026-09-11).
        #
        # Two variants:
        #   retry_cmd <desc> <attempts> <command...>
        #     Plain retry with no absence heuristics — every non-zero exit is
        #     retried. Used for pacman -Syu, where a mirror 404/"Not Found"
        #     is a transient network error, NOT a permanent absence (the old
        #     code wrongly classified any stderr containing "Not Found" as
        #     "resource absent" and failed the job immediately).
        #   retry_gh <desc> <command...>
        #     gh commands: only "release not found"/"no assets match" are
        #     treated as permanent (resource truly missing); everything else
        #     (5xx, timeouts, rate limits) is retried.
        #
        # Both capture the real exit code BEFORE any if/fi (bash's
        # `if cmd; then ...; fi` reports $?=0 after a failed condition that
        # has no else branch — the old code logged rc=0 on every failure).
        retry_cmd() {
          local desc="$1" attempts="$2"; shift 2
          local delay=5
          local i err rc
          for ((i = 1; i <= attempts; i++)); do
            err="$(mktemp)"
            "$@" 2>"$err"
            rc=$?
            if (( rc == 0 )); then
              rm -f "$err"
              return 0
            fi
            echo "::warning::$desc failed (attempt $i/$attempts, rc=$rc). Retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            rm -f "$err"
          done
          echo "::error::$desc failed after $attempts attempts."
          return 1
        }

        retry_gh() {
          local desc="$1"; shift
          local attempts=5 delay=5
          local i err rc
          for ((i = 1; i <= attempts; i++)); do
            err="$(mktemp)"
            "$@" 2>"$err"
            rc=$?
            if (( rc == 0 )); then
              rm -f "$err"
              return 0
            fi
            if grep -qiE 'release not found|no assets match' "$err"; then
              echo "::warning::$desc: resource absent, skipping"
              rm -f "$err"
              return 1
            fi
            echo "::warning::$desc failed (attempt $i/$attempts, rc=$rc). Retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            rm -f "$err"
          done
          echo "::error::$desc failed after $attempts attempts."
          return 1
        }

        # Add the [arisa] custom repo only if the DB is actually published.
        # Absence (first run) or an unrecoverable error just skips the repo;
        # pacman -Syu below remains the real gate for the job.
        if retry_gh "check release DB" gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" --json assets \
            -q '.assets[].name' \
            | grep -qx "${REPO_DB_NAME}.db"; then
          {
            echo ""
            echo "[${REPO_DB_NAME}]"
            echo SigLevel = Optional TrustAll
            echo "Server = https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          } >> /etc/pacman.conf
        fi

        # 6 attempts, 5s→160s backoff (~5.3 min) so a multi-minute network
        # outage (all mirrors + AUR unreachable on 2026-09-17) does not kill
        # the job: | attempts | worst-case time |
        # 1: 5  2: 10  3: 20  4: 40  5: 80  6: 160 => ~5.3 min of sleeping.
        retry_cmd "pacman -Syu" 6 pacman -Syu --noconfirm

    - name: Fix workspace ownership for build user
      shell: bash
      run: chown -R builder:builder "$GITHUB_WORKSPACE"