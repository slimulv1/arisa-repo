name: Prepare build environment
description: Shared environment setup for every build job (makepkg v3 config,
  pacman options + custom repo, workspace ownership). Keeps the matrix and
  kernel jobs DRY. Assumes the repository is already checked out by the job.

runs:
  using: composite
  steps:
    - name: Configure makepkg for x86-64-v3 optimization
      shell: bash
      run: |
        set -euo pipefail
        fetch_file() {
          local url="$1" dest="$2"
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --connect-timeout 15 -o "$dest" "$url"; then
              return 0
            fi
            echo "::warning::Download failed (attempt $attempt/5): $url"
            sleep $((attempt * 5))
          done
          return 1
        }
        echo "Downloading CachyOS v3 makepkg.conf..."
        fetch_file https://raw.githubusercontent.com/CachyOS/docker-makepkg/refs/heads/master/docker-makepkg-v3/makepkg.conf /etc/makepkg.conf
        echo "Downloading CachyOS v3 rust.conf..."
        mkdir -p /etc/makepkg.conf.d
        fetch_file https://raw.githubusercontent.com/CachyOS/docker-makepkg/refs/heads/master/docker-makepkg-v3/rust.conf /etc/makepkg.conf.d/rust.conf
        sed -i 's/^PKGDEST=/#PKGDEST=/g' /etc/makepkg.conf
        sed -i 's/^LOGDEST=/#LOGDEST=/g' /etc/makepkg.conf
        sed -i 's/^PACKAGECARCH=/#PACKAGECARCH=/g' /etc/makepkg.conf

    - name: Configure pacman options and custom repository
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tmp=$(mktemp)
        awk '
          BEGIN { inserted=0 }
          /^\[options\]$/ && !inserted { print; print "DisableSandboxNetwork"; inserted=1; next }
          { print }
          END { if (!inserted) exit 1 }
        ' /etc/pacman.conf > "$tmp"
        cat "$tmp" > /etc/pacman.conf
        rm -f "$tmp"

        # Retry helper: transient network/CDN failures (e.g. the Fastly SSL
        # blip seen on 2026-08-11) are retried with backoff. Expected-absence
        # results ("release not found", "no assets match") are treated as
        # permanent so a resource that simply does not exist yet is not
        # sleep-retried (first run / DB not published).
        retry_cmd() {
          local desc="$1"; shift
          local attempts=5 delay=5
          local i err rc
          for ((i = 1; i <= attempts; i++)); do
            err="$(mktemp)"
            if "$@" 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            rc=$?
            if grep -qiE 'release not found|no assets match|HTTP 404|Not Found' "$err"; then
              echo "::warning::$desc: resource absent, skipping (rc=$rc)"
              rm -f "$err"
              return 1
            fi
            echo "::warning::$desc failed (attempt $i/$attempts, rc=$rc). Retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            rm -f "$err"
          done
          echo "::error::$desc failed after $attempts attempts."
          return 1
        }

        # Add the [arisa] custom repo only if the DB is actually published.
        # Absence (first run) or an unrecoverable error just skips the repo;
        # pacman -Sy below remains the real gate for the job.
        if retry_cmd "check release DB" gh release view "$RELEASE_TAG" \
            --repo "${{ github.repository }}" --json assets \
            -q '.assets[].name' \
            | grep -qx "${REPO_DB_NAME}.db"; then
          {
            echo ""
            echo "[${REPO_DB_NAME}]"
            echo SigLevel = Optional TrustAll
            echo "Server = https://github.com/${{ github.repository }}/releases/download/$RELEASE_TAG"
          } >> /etc/pacman.conf
        fi

        retry_cmd "pacman -Sy" pacman -Sy

    - name: Fix workspace ownership for build user
      shell: bash
      run: chown -R builder:builder "$GITHUB_WORKSPACE"