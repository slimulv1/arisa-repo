name: Build one package
description: Build a single Arch package with release-cache + fallback logic.
  Pulls the previous release DB/files to decide whether the package needs a
  rebuild, downloads cached binaries when up-to-date, and falls back to the
  previous release binary when a build fails.

inputs:
  package:
    description: Package directory (repo-relative) to build
    required: true

runs:
  using: composite
  steps:
    - name: Build, Cache and Fallback Logic
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PKG: ${{ inputs.package }}
      run: |
        set -uo pipefail
        mkdir -p output /tmp/repo-files /tmp/repo-db

        # Retry helper for gh release downloads. Transient network failures are
        # retried with backoff; expected absence ("no assets match", release
        # not published yet) returns immediately so fresh packages are not
        # stalled before their first real build.
        download_retry() {
          local attempts=4 delay=5
          local i err rc
          for ((i = 1; i <= attempts; i++)); do
            err="$(mktemp)"
            if gh release download "$@" 2>"$err"; then
              rm -f "$err"
              return 0
            fi
            rc=$?
            if grep -qiE 'no assets match|release not found|HTTP 404|Not Found' "$err"; then
              echo "::warning::Download absent from release, skipping retries (rc=$rc)"
              rm -f "$err"
              return 1
            fi
            echo "::warning::Download failed (attempt $i/$attempts, rc=$rc). Retrying in ${delay}s..."
            sleep "$delay"
            delay=$((delay * 2))
            rm -f "$err"
          done
          echo "::error::Download failed after $attempts attempts."
          return 1
        }

        echo "Fetching database metadata..."
        if download_retry "$RELEASE_TAG" --repo "${{ github.repository }}" --dir /tmp/repo-db --pattern "${REPO_DB_NAME}.files.tar.gz"; then
          tar -xzf "/tmp/repo-db/${REPO_DB_NAME}.files.tar.gz" -C /tmp/repo-files 2>/dev/null || true
        fi

        echo "Fetching package hash manifest..."
        HASH_MANIFEST=""
        if download_retry "$RELEASE_TAG" --repo "${{ github.repository }}" --dir /tmp/repo-db --pattern "pkg-hashes.txt"; then
          HASH_MANIFEST="/tmp/repo-db/pkg-hashes.txt"
        fi

        echo "Checking status for $PKG"
        if grep -q 'pkgver()' "$PKG/PKGBUILD"; then
          sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE/$PKG' && makepkg -od --noprepare --skipinteg" >/dev/null 2>&1 || true
        fi

        EXPECTED_PKGS=$(sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE/$PKG' && makepkg --packagelist 2>/dev/null" || true)
        EXPECTED_PKGS="${EXPECTED_PKGS//:/.}"

        # Hash the package source directory (PKGBUILD, .SRCINFO, .install,
        # patches...). Computed AFTER makepkg -od so that a pkgver() bump that
        # rewrites the PKGBUILD is captured: any source change forces a rebuild
        # even if the generated package file name (pkgver-pkgrel) is unchanged.
        PKG_HASH=""
        mapfile -t hash_files < <(find "$PKG" -maxdepth 1 -type f | sort)
        if (( ${#hash_files[@]} > 0 )); then
          PKG_HASH=$(printf '%s\0' "${hash_files[@]}" | xargs -0 -r sha256sum 2>/dev/null | awk '{print $1}' | sha256sum | cut -d' ' -f1)
        fi
        echo "Package source hash for $PKG: ${PKG_HASH:-none}"

        REPO_HASH=""
        if [[ -n "$HASH_MANIFEST" && -f "$HASH_MANIFEST" ]]; then
          REPO_HASH=$(awk -v pkg="$PKG" '$1==pkg {print $2; exit}' "$HASH_MANIFEST")
        fi
        echo "Stored hash on release for $PKG: ${REPO_HASH:-none}"

        NEEDS_BUILD=false
        if [[ -z "$EXPECTED_PKGS" ]]; then
          NEEDS_BUILD=true
        else
          for pkg_path in $EXPECTED_PKGS; do
            pkg_basename=$(basename "$pkg_path")
            if ! grep -q -x "$pkg_basename" /tmp/repo-files/*/desc 2>/dev/null; then
              NEEDS_BUILD=true
              break
            fi
          done
        fi

        if [[ "$NEEDS_BUILD" == "false" ]]; then
          if [[ -n "$PKG_HASH" && -n "$REPO_HASH" && "$PKG_HASH" == "$REPO_HASH" ]]; then
            echo "Package source hash unchanged ($PKG_HASH)."
          else
            echo "Package source hash changed/absent (local=${PKG_HASH:-none} repo=${REPO_HASH:-none}). Forcing rebuild."
            NEEDS_BUILD=true
          fi
        fi

        if [[ "$NEEDS_BUILD" == "false" ]]; then
          echo "Package $PKG is up to date. Fetching specific cache from release."
          for pkg_path in $EXPECTED_PKGS; do
            pkg_basename=$(basename "$pkg_path")
            if ! download_retry "$RELEASE_TAG" --repo "${{ github.repository }}" --dir output --pattern "$pkg_basename"; then
              echo "Failed to fetch $pkg_basename cache. Forcing rebuild."
              NEEDS_BUILD=true
              break
            fi
          done
        fi

        if [[ "$NEEDS_BUILD" == "false" ]]; then
          echo "$PKG" > output/status-skipped-$PKG.txt
          [[ -n "$PKG_HASH" ]] && echo "$PKG $PKG_HASH" > output/hash-$PKG.txt
        else
          echo "Building $PKG with paru"
          ASSUME_PKGS=$(sudo -u builder bash -lc "cd '$GITHUB_WORKSPACE/$PKG' && source PKGBUILD && echo \${pkgname[@]}")
          ASSUME_ARGS=""
          for subpkg in $ASSUME_PKGS; do
            ASSUME_ARGS="$ASSUME_ARGS --assume-installed $subpkg"
          done
          PARU_FLAGS="--noconfirm --skipreview --useask --removemake --nocheck -B$ASSUME_ARGS"
          if [[ "$PKG" == "pacman" ]]; then
            echo "Package is pacman: adding --skipinteg to makepkg arguments"
            PARU_FLAGS="$PARU_FLAGS --mflags --skipinteg"
          fi
          sed -i 's/_BUILD_DOCS=.*/_BUILD_DOCS=0/' "$PKG/PKGBUILD"

          # Enable ccache inside the builder shell when this job configured it.
          CCACHE_BOOTSTRAP=""
          if [[ -n "${CCACHE_DIR:-}" ]] && command -v ccache >/dev/null 2>&1; then
            CCACHE_BOOTSTRAP="export PATH=/usr/lib/ccache/bin:\$PATH; export CCACHE_DIR='${CCACHE_DIR}'; "
          fi

          sudo -u builder bash -lc "${CCACHE_BOOTSTRAP}cd '$GITHUB_WORKSPACE/$PKG' && paru $PARU_FLAGS '$GITHUB_WORKSPACE/$PKG'" || true
          if ls "$PKG"/*.pkg.tar.zst >/dev/null 2>&1; then
            mv "$PKG"/*.pkg.tar.zst output/
            echo "Build OK: $PKG"
            echo "$PKG" > output/status-built-$PKG.txt
            [[ -n "$PKG_HASH" ]] && echo "$PKG $PKG_HASH" > output/hash-$PKG.txt
          else
            echo "Build failed for $PKG"
            echo "Triggering fallback mechanism for $PKG..."
            FALLBACK_SUCCESS=false
            if [[ -d /tmp/repo-files ]]; then
              for desc_file in /tmp/repo-files/*/desc; do
                [[ -f "$desc_file" ]] || continue
                base_pkg=$(awk '/^%BASE%/{getline; print; exit}' "$desc_file")
                pkg_name=$(awk '/^%NAME%/{getline; print; exit}' "$desc_file")
                check_name="${base_pkg:-$pkg_name}"
                if [[ "$check_name" == "$PKG" ]]; then
                  file_name=$(awk '/^%FILENAME%/{getline; print; exit}' "$desc_file")
                  if [[ -n "$file_name" ]]; then
                    echo "Restoring $file_name from previous release"
                    if download_retry "$RELEASE_TAG" --repo "${{ github.repository }}" --dir output --pattern "$file_name"; then
                      FALLBACK_SUCCESS=true
                      echo "$PKG" > output/status-failed-$PKG.txt
                    fi
                  fi
                fi
              done
            fi
            if [[ "$FALLBACK_SUCCESS" == "false" ]]; then
              echo "Fallback failed for $PKG: no previous files found. Gracefully exiting to ignore package."
              echo "$PKG" > output/status-failed-$PKG.txt
              exit 0
            fi
          fi
        fi

        for f in output/*:* ; do
          if [[ -f "$f" ]]; then
            new_f="${f//:/.}"
            echo "Renaming $f to $new_f"
            mv "$f" "$new_f"
          fi
        done

        sudo -u builder rm -rf "$GITHUB_WORKSPACE/$PKG/src" "$GITHUB_WORKSPACE/$PKG/pkg"